apiVersion: apps/v1
kind: Deployment
metadata:
  name: xaas
  namespace: default
  labels:
    app: xaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xaas
  template:
    metadata:
      labels:
        app: xaas
    spec:
      serviceAccountName: xaas
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: xaas
          image: xaas:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Dockerfile already `USER nobody` (uid 65534) -- asserted here
            # too so the pod-level policy is enforced even if the image
            # ever regresses. readOnlyRootFilesystem is left off pending a
            # real live check of whether the BEAM release writes to its
            # own /app tree at runtime -- adding it blind risks a silent
            # crash-loop; verify empirically before flipping it on.
          ports:
            - containerPort: 4000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: xaas-config
            - secretRef:
                name: xaas-secrets
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: xaas
  namespace: default
spec:
  selector:
    app: xaas
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
