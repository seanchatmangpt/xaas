name: SA2A computation crown

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/xaas/semantics/computation.ex"
      - "test/xaas/semantics_computation_test.exs"
      - "docs/claude/diataxis/reference/sa2a-computation-boundary.md"
      - ".github/workflows/sa2a-computation-crown.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa2a-computation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crown:
    name: Exact-head runtime-neutral computation court
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'sa2a_computation_exact_head=%s\n' "$EXPECTED_SHA"

      - name: Setup Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Execute dependency-free semantic court
        shell: bash
        run: |
          set -euo pipefail
          elixir \
            -r lib/xaas/semantics/registry.ex \
            -r lib/xaas/semantics/computation.ex \
            -e 'ExUnit.start(); Code.require_file("test/xaas/semantics_computation_test.exs")'

      - name: Assert no actuation dependency (grep guard, main lineage)
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'Xaas\.Actuation|Reactor\.run|Ash\.create|Ash\.update|Ash\.destroy' \
            lib/xaas/semantics/computation.ex

      - name: Assert no actuation dependency (AST court, PR #60 lineage)
        shell: bash
        run: |
          set -euo pipefail
          elixir -e '
          source = File.read!("lib/xaas/semantics/computation.ex")
          ast = Code.string_to_quoted!(source)

          forbidden_calls = MapSet.new([
            {[:Reactor], :run},
            {[:Ash], :create},
            {[:Ash], :update},
            {[:Ash], :destroy}
          ])

          {_ast, hits} =
            Macro.prewalk(ast, [], fn
              {:alias, _, [{:__aliases__, _, [:Xaas, :Actuation]}]} = node, acc ->
                {node, [{:alias, "Xaas.Actuation"} | acc]}

              {{:., _, [{:__aliases__, _, module}, fun]}, _, _args} = node, acc ->
                if MapSet.member?(forbidden_calls, {module, fun}) do
                  label = Enum.map_join(module, ".", &Atom.to_string/1)
                  {node, [{:call, label, fun} | acc]}
                else
                  {node, acc}
                end

              node, acc ->
                {node, acc}
            end)

          if hits == [] do
            IO.puts("sa2a computation boundary: no forbidden actuation AST")
          else
            IO.inspect(Enum.reverse(hits), label: "forbidden actuation dependency")
            System.halt(1)
          end
          '
