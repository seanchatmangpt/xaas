name: CI/CD Elixir

# Architecture (measured basis: docs/ci/CI-ARCHITECTURE.md)
#   - one lane per MIX_ENV, each restoring a lock-keyed, prefix-restorable cache
#     (.github/actions/beam) instead of rebuilding ~28 min of dependencies;
#   - lanes run concurrently from t0 (no serial image-check tail);
#   - push triggers only on main (PRs cover branches) so a sha is not run twice;
#   - PR runs are cancelled when superseded; main runs are never cancelled because
#     they seed the caches every PR restores.

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Registry publication (publish-image) and deployment (deploy) are operator
    # actuations, never a consequence of a push or merge to main: they run only
    # on a dispatch from refs/heads/main whose expected_head_sha equals the
    # dispatched github.sha and which states a reason (the receipted pattern of
    # fly_deploy.yaml). A dispatch without these inputs runs CI only.
    inputs:
      expected_head_sha:
        description: Exact main commit SHA the operator admits for image publication and deployment (empty = CI only)
        required: false
        default: ""
        type: string
      reason:
        description: Operator reason for this publication/deployment actuation (required with expected_head_sha)
        required: false
        default: ""
        type: string

concurrency:
  group: xaas-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  ci:
    # ubuntu-24.04, not ubuntu-latest: identical on GitHub-hosted runners today, and
    # act (local actuation) hardcodes ImageOS=ubuntu20 for the ubuntu-latest label,
    # which sends erlef/setup-beam to a discontinued OTP build channel (20.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: Exact-head test court
    env:
      MIX_ENV: test
    outputs:
      cache_hit: ${{ steps.beam.outputs.cache-hit }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false
          # Fresh runners make this a no-op; under act the workspace is the live
          # canonical checkout, and the default clean would `git clean -ffdx`
          # every untracked artifact (deps/, _build/) between runs.
          clean: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'admitted=%s\nobserved=%s\n' "$SUBJECT_SHA" "$actual"
          if [[ "$actual" != "$SUBJECT_SHA" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$SUBJECT_SHA"
            exit 2
          fi

      # The test env activates the dev/test-only path deps (../ash_graphlaw,
      # ../ash_surface, ../ash_affidavit; see mix.exs). A fresh runner has no
      # ../ siblings, so the court could never admit a subject: GitHub run
      # 37073966291 failed here exactly like the local act run. Pin the
      # siblings, check them out into the workspace, and link them one level
      # up (a runner-local path, never persisted).
      - name: Checkout path-dependency siblings
        uses: actions/checkout@v7
        with:
          repository: seanchatmangpt/ash_graphlaw
          ref: 03dbb36ac28b3160a1c378c3f31b6624b5f6bc05
          path: .ci-siblings/ash_graphlaw
          persist-credentials: false

      - name: Checkout ash_surface (path dep)
        uses: actions/checkout@v7
        with:
          repository: seanchatmangpt/ash_surface
          ref: 5d3e69524410054fae2ee7c45fe5e50b0e065904
          path: .ci-siblings/ash_surface
          persist-credentials: false

      - name: Checkout ash_affidavit (path dep)
        uses: actions/checkout@v7
        with:
          repository: seanchatmangpt/ash_affidavit
          ref: eda98d3867a35aeccd45eb17ce0204c59c2d0b4d
          token: ${{ secrets.GH_PAT }}
          path: .ci-siblings/ash_affidavit
          persist-credentials: false

      - name: Link path-dependency siblings
        shell: bash
        run: |
          set -euo pipefail
          for s in ash_graphlaw ash_surface ash_affidavit; do
            ln -s "$GITHUB_WORKSPACE/.ci-siblings/$s" "../$s"
          done
          ls -la ..

      - name: Toolchain, locked deps, dependency cache
        id: beam
        uses: ./.github/actions/beam
        with:
          mix-env: test

      # Cheap deterministic failures first: a lock, format or warning defect now
      # stops this lane in about a minute instead of after the test suite.
      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      # No --trace (it forces max_cases: 1 and serializes the async modules) and no
      # --max-failures 1 (the suite is ~2 min; a full failure list beats one-at-a-time
      # red cycles).
      - name: Run tests
        run: mix test --slowest 10

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

  dialyzer:
    runs-on: ubuntu-latest
    # Cold (lock changed with no usable cache) is ~26 min; warm is analysis only.
    timeout-minutes: 60
    name: Dialyzer static analysis
    env:
      MIX_ENV: dev
    outputs:
      cache_hit: ${{ steps.beam.outputs.cache-hit }}
      plt_hit: ${{ steps.plt.outputs.cache-hit }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - name: Toolchain, locked deps, dev dependency cache
        id: beam
        uses: ./.github/actions/beam
        with:
          mix-env: dev

      - name: Restore PLTs
        id: plt
        uses: actions/cache/restore@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.toolchain }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.toolchain }}-

      - name: Dialyzer static analysis
        run: mix dialyzer --format github

      # Saved even when dialyzer reports warnings (the PLT is still valid); never
      # from a cancelled run, which could leave a partial PLT.
      - name: Save PLTs
        if: ${{ !cancelled() && steps.plt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.toolchain }}-${{ hashFiles('mix.lock') }}

  asyncapi:
    runs-on: ubuntu-latest
    name: Validate AsyncAPI 3.1 contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate canonical workbench protocol
        run: npx --yes @asyncapi/cli@6.0.2 validate priv/static/asyncapi.yaml --diagnostics-format github-actions --fail-severity error

      - name: Assert runtime digest and HTTP surface stay bound to the contract
        run: |
          set -euo pipefail
          digest="sha256:917eb72a031da073f1d7e0c1295cda6023171275d79674b6303d5d817a3d4cb0"
          grep -F "$digest" Dockerfile.workbench
          grep -F "$digest" priv/static/asyncapi.yaml
          grep -F '/api/workbench/ggen' priv/static/asyncapi.yaml
          grep -F '/api/workbench/ggen/health' priv/static/asyncapi.yaml

  workbench:
    runs-on: ubuntu-latest
    name: Verify pinned GGen workbench image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compile worker adapter
        run: python3 -m py_compile fly/workbench_server.py

      - name: Build exact workbench image
        run: docker build --file Dockerfile.workbench --tag xaas-ggen-workbench:test .

      - name: Observe GGen in the exact worker image
        run: docker run --rm --entrypoint ggen xaas-ggen-workbench:test --version

      - name: Execute receipted workbench manufacture against real GGen
        run: >-
          docker run --rm -e PYTHONPATH=/opt/xaas --entrypoint python3
          xaas-ggen-workbench:test -c
          'import workbench_server as w; r=w.execute({"args":["--version"],"files":{},"timeout_ms":30000}); assert r["standing"] == "ALIVE", r; assert r["admitted"] is True, r; assert r["executed"] is True, r; assert r["verified"] is True, r; assert r["receipt"]["ggen_ecosystem_digest"] == w.GGEN_DIGEST, r; assert r["receipt"]["exit_code"] == 0, r; print(r["receipt"]["receipt_sha256"])'

  production:
    runs-on: ubuntu-latest
    # Cold prod dependency graph: sparql's generated parser plus ggen_igniter's
    # release-mode Rustler NIF (~21 min). Warm restores compiled dependencies and
    # still force-compiles the whole application with warnings as errors. The
    # from-scratch claim is re-established weekly by cold-court.yml.
    timeout-minutes: 45
    name: Exact-head production compile court
    env:
      MIX_ENV: prod
    outputs:
      cache_hit: ${{ steps.beam.outputs.cache-hit }}
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - name: Toolchain, locked deps, prod dependency cache
        id: beam
        uses: ./.github/actions/beam
        with:
          mix-env: prod

      - name: Compile production candidate with warnings as errors
        run: mix compile --force --warnings-as-errors

  image-check:
    runs-on: ubuntu-latest
    # Starts at t0 (was serialized behind every other job, ~24 min on the critical
    # path). The Docker deps layer is reused through the GitHub Actions layer cache
    # whenever mix.lock/mix.exs/VERSION are unchanged.
    timeout-minutes: 60
    name: Build container without publication
    permissions:
      contents: read
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - name: Parse versions from .tool-versions
        id: parse-asdf
        run: ./scripts/versions.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build candidate image without external DO
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=xaas-image
          cache-to: type=gha,scope=xaas-image,mode=max
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
            OTP_VERSION=${{ env.ERLANG_VERSION }}

  publish-image:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.expected_head_sha == github.sha && inputs.reason != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci, dialyzer, production, asyncapi, workbench]
    name: Publish main image
    permissions:
      contents: read
      packages: write
    outputs:
      unique_docker_tag: ${{ steps.get-unique-docker-tag.outputs.sha_tag }}
    steps:
      - name: Admit operator publication authority
        id: admit
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ACTUATION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "REFUSED[NOT_OPERATOR_DISPATCH]: $GITHUB_EVENT_NAME" >&2; exit 64; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo "REFUSED[NOT_MAIN]: $GITHUB_REF" >&2; exit 64; }
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA" || { echo "REFUSED[HEAD_MOVED]: expected $EXPECTED_HEAD_SHA, observed $GITHUB_SHA" >&2; exit 64; }
          test -n "$ACTUATION_REASON" || { echo "REFUSED[REASON_MISSING]" >&2; exit 64; }

      - name: Checkout admitted main SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert publish subject identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xaas
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Parse versions from .tool-versions
        id: parse-asdf
        run: ./scripts/versions.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish admitted main image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/xaas:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/xaas:cache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
            OTP_VERSION=${{ env.ERLANG_VERSION }}

      - name: Record unique image tag
        id: get-unique-docker-tag
        run: |-
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep 'sha' | tr '\n' ' ' | awk '{print $1}')
          echo "sha_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Manufacture publication receipt
        if: always() && steps.admit.outcome == 'success'
        env:
          ACTUATION_REASON: ${{ inputs.reason }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          UNIQUE_TAG: ${{ steps.get-unique-docker-tag.outputs.sha_tag }}
        run: |
          set -euo pipefail
          # Independent consequence check: the registry must serve the pushed digest.
          REGISTRY_DIGEST=unobserved
          if [ -n "$UNIQUE_TAG" ] && docker buildx imagetools inspect --raw "$UNIQUE_TAG" > registry-manifest.raw; then
            REGISTRY_DIGEST="sha256:$(sha256sum registry-manifest.raw | cut -d' ' -f1)"
          fi
          export REGISTRY_DIGEST
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          executed = os.environ["BUILD_OUTCOME"] not in ("", "skipped")
          verified = (
              os.environ["BUILD_OUTCOME"] == "success"
              and os.environ["IMAGE_DIGEST"].startswith("sha256:")
              and os.environ["REGISTRY_DIGEST"] == os.environ["IMAGE_DIGEST"]
          )
          receipt = {
              "protocol": "xaas.image-publish.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "head_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "actor": os.environ["GITHUB_ACTOR"],
              "reason": os.environ["ACTUATION_REASON"],
              "build_outcome": os.environ["BUILD_OUTCOME"],
              "image_tags": sorted(t for t in os.environ["IMAGE_TAGS"].split() if t),
              "image_digest": os.environ["IMAGE_DIGEST"],
              "registry_digest": os.environ["REGISTRY_DIGEST"],
              "unique_tag": os.environ["UNIQUE_TAG"],
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "executed": executed,
              "verified": verified,
              "standing": "ALIVE" if verified else "UNKNOWN",
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()
          Path("publish-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          cat publish-receipt.json
          {
            echo '## Image publication receipt'
            echo '```json'
            cat publish-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve publication receipt
        if: always() && steps.admit.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xaas-publish-${{ github.sha }}
          path: publish-receipt.json
          if-no-files-found: error
          retention-days: 90

  receipt:
    # Not on cancellation: a superseded PR run must not report a failure for work
    # that was deliberately stopped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [ci, dialyzer, production, asyncapi, workbench, image-check]
    name: Bound CI receipt
    permissions:
      contents: read
    steps:
      - name: Manufacture bounded receipt
        shell: bash
        env:
          R_CI: ${{ needs.ci.result }}
          R_DIALYZER: ${{ needs.dialyzer.result }}
          R_PRODUCTION: ${{ needs.production.result }}
          R_ASYNCAPI: ${{ needs.asyncapi.result }}
          R_WORKBENCH: ${{ needs.workbench.result }}
          R_IMAGE: ${{ needs.image-check.result }}
          H_CI: ${{ needs.ci.outputs.cache_hit }}
          H_DIALYZER: ${{ needs.dialyzer.outputs.cache_hit }}
          H_PLT: ${{ needs.dialyzer.outputs.plt_hit }}
          H_PRODUCTION: ${{ needs.production.outputs.cache_hit }}
        run: |
          set -euo pipefail
          mkdir -p receipt
          cat > receipt/ci.json <<JSON
          {
            "subject_sha": "${SUBJECT_SHA}",
            "ci": "${R_CI}",
            "dialyzer": "${R_DIALYZER}",
            "production": "${R_PRODUCTION}",
            "asyncapi": "${R_ASYNCAPI}",
            "workbench": "${R_WORKBENCH}",
            "image_check": "${R_IMAGE}",
            "exact_cache_hit": {
              "test": "${H_CI}", "dev": "${H_DIALYZER}", "plt": "${H_PLT}", "prod": "${H_PRODUCTION}"
            },
            "publication": "not_attempted_by_candidate_court",
            "standing": "candidate_evidence_only"
          }
          JSON
          python3 -m json.tool receipt/ci.json
          {
            echo '### CI receipt'
            echo '| lane | result | exact cache hit |'
            echo '|---|---|---|'
            echo "| test court | ${R_CI} | ${H_CI} |"
            echo "| dialyzer | ${R_DIALYZER} | deps ${H_DIALYZER} / plt ${H_PLT} |"
            echo "| production compile | ${R_PRODUCTION} | ${H_PRODUCTION} |"
            echo "| asyncapi | ${R_ASYNCAPI} | - |"
            echo "| workbench | ${R_WORKBENCH} | - |"
            echo "| image build | ${R_IMAGE} | docker layer cache (gha) |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$R_CI" "$R_DIALYZER" "$R_PRODUCTION" "$R_ASYNCAPI" "$R_WORKBENCH" "$R_IMAGE"; do
            test "$r" = success
          done

      - name: Preserve CI receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xaas-ci-${{ env.SUBJECT_SHA }}
          path: receipt/ci.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.expected_head_sha == github.sha && inputs.reason != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish-image
    name: Deploy application
    steps:
      - name: Admit operator deployment authority
        id: admit
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ACTUATION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "REFUSED[NOT_OPERATOR_DISPATCH]: $GITHUB_EVENT_NAME" >&2; exit 64; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo "REFUSED[NOT_MAIN]: $GITHUB_REF" >&2; exit 64; }
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA" || { echo "REFUSED[HEAD_MOVED]: expected $EXPECTED_HEAD_SHA, observed $GITHUB_SHA" >&2; exit 64; }
          test -n "$ACTUATION_REASON" || { echo "REFUSED[REASON_MISSING]" >&2; exit 64; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: deploy
        uses: ./.github/actions/deploy
        with:
          github_user: ${{ github.repository_owner }}
          gh_pat: ${{ secrets.GH_PAT }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          age_key: ${{ secrets.AGE_KEY }}
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          image_tag: ${{ needs.publish-image.outputs.unique_docker_tag }}

      - name: Manufacture deployment receipt
        if: always() && steps.admit.outcome == 'success'
        env:
          ACTUATION_REASON: ${{ inputs.reason }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          IMAGE_TAG: ${{ needs.publish-image.outputs.unique_docker_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "protocol": "xaas.swarm-deploy.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "head_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "actor": os.environ["GITHUB_ACTOR"],
              "reason": os.environ["ACTUATION_REASON"],
              "deploy_outcome": os.environ["DEPLOY_OUTCOME"],
              "image_tag": os.environ["IMAGE_TAG"],
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "executed": os.environ["DEPLOY_OUTCOME"] not in ("", "skipped"),
              # scripts/deploy.sh exit status only: this path has no post-deploy health check.
              "verified": False,
              "standing": "PARTIAL_ALIVE" if os.environ["DEPLOY_OUTCOME"] == "success" else "UNKNOWN",
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          receipt["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()
          Path("deploy-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          cat deploy-receipt.json
          {
            echo '## Deployment receipt'
            echo '```json'
            cat deploy-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve deployment receipt
        if: always() && steps.admit.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xaas-deploy-${{ github.sha }}
          path: deploy-receipt.json
          if-no-files-found: error
          retention-days: 90
