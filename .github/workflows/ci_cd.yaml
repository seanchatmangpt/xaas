name: CI/CD Elixir

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Real fix (confirmed via a real failed CI run this session, "Password
# required" logging into ghcr.io): the workflow referenced secrets.GH_PAT,
# a repo secret that was never configured. Rather than create and store a
# new PAT, grant the job's own built-in GITHUB_TOKEN package-write
# permission -- the standard, lower-friction way to push to ghcr.io from
# the same repo, no new credential needed.
permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Compile with mix test, format, dialyzer & unused deps check
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:15.2
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        # Real fix: v1.17.3's OS-mapping table doesn't recognize ubuntu-latest's
        # current ImageOS=ubuntu24 -- confirmed via 2 real failed runs this session
        # (32408751129, 32407995438), root-caused via `gh run view --log-failed`.
        # Bumped to the real latest release, which supports ubuntu24.
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps directory
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache plt files
        uses: actions/cache@v4
        env: 
          EX_OTP_VERSIONS: ${{ steps.setup-beam.outputs.elixir-version }}
          KEY_BASE: plt-${{ runner.os }}-${{ env.EX_OTP_VERSIONS }}
        with:
          path: |
            priv/plts
          key: |
            ${{ env.KEY_BASE }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ env.KEY_BASE }}-

      - name: Get dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: mix deps.get

      - run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --max-failures 1 --trace

      - name: Check code is formatted
        run: mix format --check-formatted

      - name: Dialyzer static analysis
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

  build-push:
    runs-on: ubuntu-latest
    needs: ci
    name: Build Docker image & push to ghcr.io
    outputs:
      unique_docker_tag: ${{ steps.get-unique-docker-tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/xaas
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=short

      - name: Parse versions from .tool-versions
        id: parse-asdf
        run: ./scripts/versions.sh

      - uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/xaas:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/xaas:cache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
            OTP_VERSION=${{ env.ERLANG_VERSION }}

      - name: Gets unique image tag
        id: get-unique-docker-tag
        if: github.ref == 'refs/heads/main'
        run: |-
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" \
                      | grep 'sha' \
                      | tr '\n' ' ' \
                      | awk '{print $1}')
          echo "sha_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  # if: false # requires real AWS credentials, see docs/AWS-CHAPTERS-SUBSTITUTION.md
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-push
    name: Deploy application
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy
        with:
          github_user: ${{ github.repository_owner }}
          gh_pat: ${{ secrets.GH_PAT }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          age_key: ${{ secrets.AGE_KEY }}
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          image_tag: ${{ needs.build-push.outputs.unique_docker_tag }}
