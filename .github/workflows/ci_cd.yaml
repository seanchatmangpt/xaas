name: CI/CD Elixir

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Exact-head BEAM + Ash release court
    env:
      MIX_ENV: test
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:15.2
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact subject identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'EXACT_SUBJECT repo=%s sha=%s\n' "$GITHUB_REPOSITORY" "$EXPECTED_SHA"

      - name: Setup exact BEAM toolchain
        id: setup-beam
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-beam-${{ hashFiles('.tool-versions') }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-${{ hashFiles('.tool-versions') }}-mix-

      - name: Cache PLTs
        uses: actions/cache@v4
        env:
          BEAM_VERSION: ${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ env.BEAM_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ env.BEAM_VERSION }}-

      - name: Resolve dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Audit v26.8.21 repository contract
        run: mix xaas.release_audit

      - name: Run full migration and test court
        run: mix test --max-failures 1 --trace

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check generated AshTypescript projection
        run: mix ash_typescript.codegen --check

      - name: Dialyzer static analysis
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

  container-build:
    runs-on: ubuntu-latest
    needs: ci
    name: Build release container
    outputs:
      unique_docker_tag: ${{ steps.get-unique-docker-tag.outputs.sha_tag }}
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      RELEASE_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact subject identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Login to GHCR for authorized main push
        if: env.RELEASE_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xaas
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=short

      - name: Parse versions from .tool-versions
        run: ./scripts/versions.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build exact release image
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.RELEASE_PUSH == 'true' }}
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
            OTP_VERSION=${{ env.ERLANG_VERSION }}
            DEBIAN_VERSION=bookworm-20260623-slim

      - name: Capture authorized main image tag
        id: get-unique-docker-tag
        if: env.RELEASE_PUSH == 'true'
        run: |-
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep 'sha' | head -n1)
          echo "sha_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: container-build
    name: Deploy application
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/deploy
        with:
          github_user: ${{ github.repository_owner }}
          gh_pat: ${{ secrets.GH_PAT }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          age_key: ${{ secrets.AGE_KEY }}
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          image_tag: ${{ needs.container-build.outputs.unique_docker_tag }}
