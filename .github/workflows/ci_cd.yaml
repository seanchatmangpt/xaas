name: CI/CD Elixir

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - epoch/**
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xaas-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  autonomic-wave-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Exact-head autonomic-wave contract
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:15.2
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'admitted=%s\\nobserved=%s\\n' "$SUBJECT_SHA" "$actual"
          test "$actual" = "$SUBJECT_SHA" || {
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$SUBJECT_SHA"
            exit 2
          }

      - name: Setup Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache exact-toolchain deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}

      - name: Resolve locked dependencies
        run: mix deps.get --check-locked

      - name: Run focused autonomic-wave court
        run: >-
          mix test test/xaas/ultracode/autonomic_wave_schedule_test.exs
          --only autonomic_wave_contract
          --max-failures 1
          --trace

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Exact-head test court
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:15.2
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'admitted=%s\nobserved=%s\n' "$SUBJECT_SHA" "$actual"
          if [[ "$actual" != "$SUBJECT_SHA" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$SUBJECT_SHA"
            exit 2
          fi

      - name: Setup Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache exact-toolchain deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}

      - name: Resolve locked dependencies
        run: mix deps.get --check-locked

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Run tests
        run: mix test --max-failures 1 --trace

      - name: Dialyzer static analysis
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

  asyncapi:
    runs-on: ubuntu-latest
    name: Validate AsyncAPI 3.1 contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate canonical workbench protocol
        run: npx --yes @asyncapi/cli@6.0.2 validate priv/static/asyncapi.yaml --diagnostics-format github-actions --fail-severity error

      - name: Assert runtime digest and HTTP surface stay bound to the contract
        run: |
          set -euo pipefail
          digest="sha256:917eb72a031da073f1d7e0c1295cda6023171275d79674b6303d5d817a3d4cb0"
          grep -F "$digest" Dockerfile.workbench
          grep -F "$digest" priv/static/asyncapi.yaml
          grep -F '/api/workbench/ggen' priv/static/asyncapi.yaml
          grep -F '/api/workbench/ggen/health' priv/static/asyncapi.yaml

  workbench:
    runs-on: ubuntu-latest
    name: Verify pinned GGen workbench image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compile worker adapter
        run: python3 -m py_compile fly/workbench_server.py

      - name: Build exact workbench image
        run: docker build --file Dockerfile.workbench --tag xaas-ggen-workbench:test .

      - name: Observe GGen in the exact worker image
        run: docker run --rm --entrypoint ggen xaas-ggen-workbench:test --version

      - name: Execute receipted workbench manufacture against real GGen
        run: >-
          docker run --rm -e PYTHONPATH=/opt/xaas --entrypoint python3
          xaas-ggen-workbench:test -c
          'import workbench_server as w; r=w.execute({"args":["--version"],"files":{},"timeout_ms":30000}); assert r["standing"] == "ALIVE", r; assert r["admitted"] is True, r; assert r["executed"] is True, r; assert r["verified"] is True, r; assert r["receipt"]["ggen_ecosystem_digest"] == w.GGEN_DIGEST, r; assert r["receipt"]["exit_code"] == 0, r; print(r["receipt"]["receipt_sha256"])'

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    name: Exact-head production compile court
    env:
      MIX_ENV: prod
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SUBJECT_SHA" || {
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=$actual expected=$SUBJECT_SHA"
            exit 2
          }

      - name: Setup Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Resolve production dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get --check-locked

      - name: Compile production candidate with warnings as errors
        run: mix compile --force --warnings-as-errors

  image-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci, production, asyncapi, workbench]
    name: Build container without publication
    permissions:
      contents: read
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"

      - name: Parse versions from .tool-versions
        id: parse-asdf
        run: ./scripts/versions.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build candidate image without external DO
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
            OTP_VERSION=${{ env.ERLANG_VERSION }}

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci, production, asyncapi, workbench]
    name: Publish main image
    permissions:
      contents: read
      packages: write
    outputs:
      unique_docker_tag: ${{ steps.get-unique-docker-tag.outputs.sha_tag }}
    steps:
      - name: Checkout admitted main SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert publish subject identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xaas
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Parse versions from .tool-versions
        id: parse-asdf
        run: ./scripts/versions.sh

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish admitted main image
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/xaas:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/xaas:cache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
            OTP_VERSION=${{ env.ERLANG_VERSION }}

      - name: Record unique image tag
        id: get-unique-docker-tag
        run: |-
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep 'sha' | tr '\n' ' ' | awk '{print $1}')
          echo "sha_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  receipt:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [ci, production, image-check]
    name: Bound CI receipt
    permissions:
      contents: read
    steps:
      - name: Manufacture bounded receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          cat > receipt/ci.json <<JSON
          {
            "subject_sha": "${SUBJECT_SHA}",
            "ci": "${{ needs.ci.result }}",
            "production": "${{ needs.production.result }}",
            "image_check": "${{ needs.image-check.result }}",
            "publication": "not_attempted_by_candidate_court",
            "standing": "candidate_evidence_only"
          }
          JSON
          python3 -m json.tool receipt/ci.json
          test "${{ needs.ci.result }}" = success
          test "${{ needs.production.result }}" = success
          test "${{ needs.image-check.result }}" = success

      - name: Preserve CI receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xaas-ci-${{ env.SUBJECT_SHA }}
          path: receipt/ci.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish-image
    name: Deploy application
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/deploy
        with:
          github_user: ${{ github.repository_owner }}
          gh_pat: ${{ secrets.GH_PAT }}
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          age_key: ${{ secrets.AGE_KEY }}
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          image_tag: ${{ needs.publish-image.outputs.unique_docker_tag }}
