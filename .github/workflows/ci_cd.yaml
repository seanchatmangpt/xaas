name: CI/CD Elixir

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Real fix (confirmed via a real failed CI run this session, "Password
# required" logging into ghcr.io): the workflow referenced secrets.GH_PAT,
# a repo secret that was never configured. Rather than create and store a
# new PAT, grant the job's own built-in GITHUB_TOKEN package-write
# permission -- the standard, lower-friction way to push to ghcr.io from
# the same repo, no new credential needed.
permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Compile with mix test, format, dialyzer & unused deps check
    env:
      MIX_ENV: test
    services:
      postgres:
        # The admitted XaaS schema creates the pgvector `vector` extension.
        # Pin both pgvector and PostgreSQL major plus the multi-arch image
        # digest so the verifier supplies the same capability deterministically
        # instead of weakening migrations to fit vanilla postgres.
        image: pgvector/pgvector:0.8.6-pg15-bookworm@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # mix.exs deliberately consumes Ex4pm.OCEL through the sibling path
      # ../ex4pm. PR CI previously ran without materializing that dependency,
      # so mix compile stopped before compiling XaaS. Pin the exact producer
      # identity and assert it before dependency resolution: verification may
      # not silently follow ex4pm/main.
      - name: Materialize exact ex4pm path dependency
        run: |
          set -euo pipefail
          EX4PM_SHA=426455b6dfaf3931f85cc05b612ff73759766267
          rm -rf ../ex4pm
          git init ../ex4pm
          git -C ../ex4pm remote add origin https://github.com/seanchatmangpt/ex4pm.git
          git -C ../ex4pm fetch --depth=1 origin "$EX4PM_SHA"
          git -C ../ex4pm checkout --detach FETCH_HEAD
          test "$(git -C ../ex4pm rev-parse HEAD)" = "$EX4PM_SHA"

      - name: Setup Elixir
        # Real fix: v1.17.3's OS-mapping table doesn't recognize ubuntu-latest's
        # current ImageOS=ubuntu24 -- confirmed via 2 real failed runs this session
        # (32408751129, 32407995438), root-caused via `gh run view --log-failed`.
        # Bumped to the real latest release, which supports ubuntu24.
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps directory
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache plt files
        uses: actions/cache@v4
        env:
          EX_OTP_VERSIONS: ${{ steps.setup-beam.outputs.elixir-version }}
          KEY_BASE: plt-${{ runner.os }}-${{ env.EX_OTP_VERSIONS }}
        with:
          path: |
            priv/plts
          key: |
            ${{ env.KEY_BASE }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ env.KEY_BASE }}-

      - name: Get dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: mix deps.get

      - run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --max-failures 1 --trace

      - name: Check code is formatted
        run: mix format --check-formatted

      - name: Dialyzer static analysis
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

  asyncapi:
    runs-on: ubuntu-latest
    name: Validate AsyncAPI 3.1 contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate canonical workbench protocol
        run: npx --yes @asyncapi/cli@6.0.2 validate priv/static/asyncapi.yaml --diagnostics-format github-actions --fail-severity error

      - name: Assert runtime digest and HTTP surface stay bound to the contract
        run: |
          set -euo pipefail
          digest="sha256:917eb72a031da073f1d7e0c1295cda6023171275d79674b6303d5d817a3d4cb0"
          grep -F "$digest" Dockerfile.workbench
          grep -F "$digest" priv/static/asyncapi.yaml
          grep -F '/api/workbench/ggen' priv/static/asyncapi.yaml
          grep -F '/api/workbench/ggen/health' priv/static/asyncapi.yaml

  workbench:
    runs-on: ubuntu-latest
    name: Verify pinned GGen workbench image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compile worker adapter
        run: python3 -m py_compile fly/workbench_server.py

      - name: Build exact workbench image
        run: docker build --file Dockerfile.workbench --tag xaas-ggen-workbench:test .

      - name: Observe GGen in the exact worker image
        run: docker run --rm --entrypoint ggen xaas-ggen-workbench:test --version

      - name: Execute receipted workbench manufacture against real GGen
        run: >-
          docker run --rm -e PYTHONPATH=/opt/xaas --entrypoint python3
          xaas-ggen-workbench:test -c
          'import workbench_server as w; r=w.execute({"args":["--version"],"files":{},"timeout_ms":30000}); assert r["standing"] == "ALIVE", r; assert r["admitted"] is True, r; assert r["executed"] is True, r; assert r["verified"] is True, r; assert r["receipt"]["ggen_ecosystem_digest"] == w.GGEN_DIGEST, r; assert r["receipt"]["exit_code"] == 0, r; print(r["receipt"]["receipt_sha256"])'

  build-push:
    runs-on: ubuntu-latest
    needs: [ci, asyncapi, workbench]
    name: Build Docker image & push to ghcr.io
    outputs:
      unique_docker_tag: ${{ steps.get-unique-docker-tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/xaas
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=short

      - name: Parse versions from .tool-versions
        id: parse-asdf
        run: ./scripts/versions.sh

      - uses: docker/setup-buildx-action@v3

      # Real fix (confirmed via a real failed CI run this session, run
      # 32414558650): the linux/arm64 leg of this multi-arch build runs
      # under QEMU user-mode emulation on GitHub's amd64-only hosted
      # runners, and the emulated `apt-get install build-essential` step
      # segfaults inside libc-bin's postinst script (real, known QEMU/
      # glibc emulation flakiness, not a Dockerfile bug). GitHub-hosted
      # runners have no native arm64 option for public repos without a
      # separate paid arm64 runner, so build for the runner's real native
      # architecture only rather than an emulated target that reliably
      # crashes.
      - uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/xaas:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/xaas:cache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VERSION }}
            OTP_VERSION=${{ env.ERLANG_VERSION }}

      - name: Gets unique image tag
        id: get-unique-docker-tag
        if: github.ref == 'refs/heads/main'
        run: |-
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" \
                      | grep 'sha' \
                      | tr '\n' ' ' \
                      | awk '{print $1}')
          echo "sha_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

# Production DO is intentionally not coupled to a push or merge. The former
# inherited AWS deploy job was removed: `.github/workflows/fly_deploy.yaml`
# is now the sole production deployment path and requires an exact admitted
# main SHA, an operator reason, scoped Fly deploy tokens, post-deploy execution,
# and a deployment receipt.
