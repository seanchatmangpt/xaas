# .doc-surface.toml — doc-surface audit policy (lane R26, 2026-10-09)
#
# AUDITED-SURFACE POLICY DECISION (receipted)
#
# The historical/receipt plane of this repository is not API documentation:
# order history, wave receipts, and campaign records are receipts about past
# work, not docs about the live system. They are scoped OUT of the
# doc-surface audit BY THIS DECISION, not by silence. The gate thresholds
# (S_coverage >= 0.90, Phi_halluc <= 0.001, Q_density >= 0.65) are NOT
# relaxed — this policy changes which doc surface is audited, nothing else.

# Audited doc roots (developer-facing documentation of the live system):
