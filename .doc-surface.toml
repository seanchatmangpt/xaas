# Machine-honored sections (extractor reads these):
#   [[generated]] — generated files excluded from the public code surface;
#     references classify external_documented, never phantom.

# PIPELINE BINDING: the audit runner extracts doc claims with
#   gen_doc_surface.py doc REPO --code-json code.json \
#     --docs-dir <each entry of audited_doc_roots, absolute, comma-joined>
# A change to audited_doc_roots requires a new receipt showing the old
# policy failing or the new surface passing.
