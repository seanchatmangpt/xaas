# you can start this with docker compose -f compose.yaml -f compose-adminer.yaml up -d
version: '3.9'

services:

  adminer:
    image: adminer
    restart: always
    ports:
      # Default changed from the book's 8080:8080 -- 8080 real-collides with
      # a pre-existing local kind cluster's control-plane port mapping on
      # this machine. Override with ADMINER_PORT if 8081 also collides.
      - ${ADMINER_PORT:-8081}:8080
