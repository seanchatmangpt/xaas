# Project-local ggen.toml -- the XaaS consumer root.
#
# Historical qualified lineage is deliberately preserved:
# ggen-marketplace/packs/xaas-ash-core-pack/ontology.ttl
# The original xaas-ash-core ontology remains vendored because that path predates
# current remote-pack support and its generated Ash surfaces are already qualified.
# New reusable capabilities MUST prefer locked marketplace packs over new vendored
# copies. The CASTLE bridge below uses ggen-engine's native git+subdir resolver:
# it checks out the exact producer SHA, unions the pack ontology into this graph,
# discovers the pack templates, includes every pack byte in the content hash, and
# binds the pack into the sync receipt/lock closure.

[project]
name = "xaas"

[ontology]
source = "ontology.ttl"

[packs.xaas_castle_bridge]
git = "https://github.com/seanchatmangpt/ggen-marketplace.git"
version = "518572b6b53103922ae8a27636a00e982a0907c4"
subdir = "packs/xaas-castle-bridge-pack"

[templates]
dir = "templates-hooks"

[law]
# Make the generator's own prior receipt DAG queryable by future innovation packs.
# Current CASTLE bridge templates remain byte-deterministic because they do not
# depend on ggenr:Sync facts; opting in preserves the observation surface now.
reflexive = true
