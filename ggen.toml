# Project-local ggen.toml -- lives at the root of the Ash project itself
# (the "project that has the renderer in it"), not inside ggen-marketplace.
# This is deliberate: sh_after hooks run with THIS directory as cwd, so
# real `mix` commands run in the correct place -- the marketplace pack's own
# directory is not, and should not be, relevant to sh_after execution.
#
# Ontology is a VENDORED COPY of ggen-marketplace/packs/xaas-ash-core-pack/ontology.ttl,
# not a live reference -- confirmed via real ggen sync run errors that both
# path traversal (`../..`) and absolute paths outside the project root are
# refused (FM-CONFIG-003 invalid_path, both tested directly). Real ggen
# design requires the ontology to live inside the consuming project. Keep
# this in sync manually (or via a real symlink if that path is later proven
# to work) -- do not silently let it drift; re-copy after any real change
# to the marketplace pack's own ontology.ttl.

[project]
name = "xaas"

[ontology]
source = "ontology.ttl"

[templates]
dir = "templates-hooks"
