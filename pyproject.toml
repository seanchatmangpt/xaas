[project]
name = "eds"
version = "0.1.0"
description = "Executable Design Science: ERC records, receipts, evidence-state enforcement, and program metrics."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# §pytest-cache-race: see napoleon/pyproject.toml for the full incident
# writeup. The machine-wide TMPDIR (/Users/sac/.cache/tmp) is shared by every
# concurrent pytest/xdist run on this machine across all repos; its
# garbage-collection cleanup assumes exclusive ownership and races when two
# unrelated pytest processes run concurrently, producing spurious "Directory
# not empty" / "Permission denied" PytestWarnings (reproduced for real here:
# 345 such warnings referencing test names -- e.g. test_registered_azure_adapter,
# test_powl_and_agent_import_and -- that do not exist in this repo). Fix:
# give this repo's own runs a private, non-shared base temp directory outside
# any git working tree so they never touch the shared pytest-of-sac pool.
addopts = "--basetemp=/tmp/eds-pytest-tmp"

[project.scripts]
eds = "eds.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
